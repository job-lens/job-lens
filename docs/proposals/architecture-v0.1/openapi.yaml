openapi: 3.1.1
info: {title: 融职境 API, version: 0.1.1, description: 'Resource authorization and transaction rules: api-contract.md. M1=foundation, M2=training workflow, M3=support.'}
servers: [{url: /api/v1}]
security: [{WebSession: []}]
x-shared:
  uuid: &uuid {type: string, format: uuid}
  time: &time {type: string, format: date-time}
  version: &version {type: integer, minimum: 1, maximum: 2147483647}
  count: &count {type: integer, minimum: 0, maximum: 2147483647}
  bool: &bool {type: boolean}
  attachments: &attachments {type: array, items: *uuid, maxItems: 5}
  task_status: &task_status {type: string, enum: [not_started, in_progress, paused, submitted, changes_requested, completed, cancelled]}
  nullable_uuid: &nullable_uuid {anyOf: [*uuid, {type: 'null'}]}
  nullable_time: &nullable_time {anyOf: [*time, {type: 'null'}]}
  error: &error {$ref: '#/components/responses/Problem'}
  CSRF: &CSRF {$ref: '#/components/parameters/CSRF'}
  Idempotency: &Idempotency {$ref: '#/components/parameters/Idempotency'}
  IfMatch: &IfMatch {$ref: '#/components/parameters/IfMatch'}
  Limit: &Limit {$ref: '#/components/parameters/Limit'}
  Cursor: &Cursor {$ref: '#/components/parameters/Cursor'}
  AfterSeq: &AfterSeq {$ref: '#/components/parameters/AfterSeq'}
  LastEventId: &LastEventId {$ref: '#/components/parameters/LastEventId'}
components:
  securitySchemes:
    WebSession: {type: apiKey, in: cookie, name: __Host-jl_session, description: 'Opaque session; Secure, HttpOnly, SameSite=Lax. Writes require CSRF and Origin validation.'}
  parameters:
    CSRF: {name: X-CSRF-Token, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 256}}
    Idempotency: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$'}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, maxLength: 30, pattern: '^"[1-9][0-9]*"$'}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 512}}
    AfterSeq: {name: after_seq, in: query, schema: {type: string, maxLength: 20, pattern: '^(0|[1-9][0-9]*)$', default: '0'}}
    LastEventId: {name: Last-Event-ID, in: header, schema: {type: string, maxLength: 20, pattern: '^(0|[1-9][0-9]*)$'}}
  responses:
    Problem: {description: 'HTTP error with stable code. See api-contract.md.', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    Problem: {type: object, additionalProperties: false, required: [type, title, status, code, trace_id], properties: {type: {type: string, maxLength: 200, format: uri-reference}, title: {type: string, minLength: 1, maxLength: 100}, status: {type: integer, minimum: 400, maximum: 599}, code: {type: string, minLength: 1, maxLength: 80}, trace_id: {type: string, minLength: 1, maxLength: 128}, detail: {type: string, maxLength: 2000}, errors: {type: array, items: {type: object, additionalProperties: false, required: [field, reason], properties: {field: {type: string, maxLength: 200}, reason: {type: string, maxLength: 200}}}, maxItems: 100}, resource_id: *uuid}}
    Health: {type: object, additionalProperties: false, required: [status], properties: {status: {type: string, enum: [ok]}}}
    CsrfToken: {type: object, additionalProperties: false, required: [csrf_token], properties: {csrf_token: {type: string, minLength: 16, maxLength: 256}}}
    LoginRequest: {type: object, additionalProperties: false, required: [login_name, password], properties: {login_name: {type: string, minLength: 1, maxLength: 80}, password: {type: string, minLength: 1, maxLength: 256}}}
    User: {type: object, additionalProperties: false, required: [id, display_name, roles], properties: {id: *uuid, display_name: {type: string, minLength: 1, maxLength: 80}, roles: {type: array, items: {type: string, enum: [learner, counselor]}, maxItems: 2, minItems: 1, uniqueItems: true}}}
    LoginResult: {type: object, additionalProperties: false, required: [user, csrf_token], properties: {user: {$ref: '#/components/schemas/User'}, csrf_token: {type: string, minLength: 16, maxLength: 256}}}
    PreferencesWrite: {type: object, additionalProperties: false, required: [font_scale, volume, quiet_mode, speech_enabled, vibration_enabled], properties: {font_scale: {type: number, enum: [1, 1.25, 1.5]}, volume: {type: number, minimum: 0, maximum: 1}, quiet_mode: *bool, speech_enabled: *bool, vibration_enabled: *bool}}
    Preferences: {type: object, additionalProperties: false, required: [font_scale, volume, quiet_mode, speech_enabled, vibration_enabled, version], properties: {font_scale: {type: number, enum: [1, 1.25, 1.5]}, volume: {type: number, minimum: 0, maximum: 1}, quiet_mode: *bool, speech_enabled: *bool, vibration_enabled: *bool, version: *version}}
    ProfileWrite: {type: object, additionalProperties: false, required: [display_name, sensory_preferences, communication_preference, work_notes], properties: {display_name: {type: string, minLength: 1, maxLength: 80}, sensory_preferences: {type: array, items: {type: string, minLength: 1, maxLength: 40}, maxItems: 10}, communication_preference: {type: string, maxLength: 200}, work_notes: {type: string, maxLength: 1000}}}
    Profile: {type: object, additionalProperties: false, required: [display_name, sensory_preferences, communication_preference, work_notes, user_id, version], properties: {display_name: {type: string, minLength: 1, maxLength: 80}, sensory_preferences: {type: array, items: {type: string, minLength: 1, maxLength: 40}, maxItems: 10}, communication_preference: {type: string, maxLength: 200}, work_notes: {type: string, maxLength: 1000}, user_id: *uuid, version: *version}}
    CaseProfile: {type: object, additionalProperties: false, required: [profile, preferences], properties: {profile: {$ref: '#/components/schemas/Profile'}, preferences: {$ref: '#/components/schemas/Preferences'}}, description: 'Read-only counselor view. Profile and preferences retain independent versions; no composite write ETag.'}
    Capabilities: {type: object, additionalProperties: false, required: [screenshot_annotation, realtime_calls, sop_conversion, realtime_ar, precise_location], properties: {screenshot_annotation: *bool, realtime_calls: *bool, sop_conversion: *bool, realtime_ar: *bool, precise_location: *bool}}
    Dashboard: {type: object, additionalProperties: false, required: [view, pending_tasks, pending_feedback, pending_assistance, as_of], properties: {view: {type: string, enum: [learner, counselor]}, pending_tasks: *count, pending_feedback: *count, pending_assistance: *count, as_of: *time}}
    Case: {type: object, additionalProperties: false, required: [id, learner_id, counselor_id, lifecycle, display_status, current_task_id, version], properties: {id: *uuid, learner_id: *uuid, counselor_id: *nullable_uuid, lifecycle: {type: string, enum: [pending_match, active, closed]}, display_status: {type: string, enum: [pending_match, sop_pending, training, awaiting_feedback, feedback_available, stage_complete, closed]}, current_task_id: *nullable_uuid, version: *version}}
    MatchWrite: {type: object, additionalProperties: false, required: [direction, focus, cycle_weeks, basis], properties: {direction: {type: string, maxLength: 80}, focus: {type: string, maxLength: 500}, cycle_weeks: {type: integer, minimum: 1, maximum: 52}, basis: {type: string, maxLength: 1000}}, description: 'Draft text may be empty; confirmation requires non-whitespace direction, focus and basis.'}
    SupportMatch: {type: object, additionalProperties: false, required: [direction, focus, cycle_weeks, basis, id, case_id, state, version], properties: {direction: {type: string, maxLength: 80}, focus: {type: string, maxLength: 500}, cycle_weeks: {type: integer, minimum: 1, maximum: 52}, basis: {type: string, maxLength: 1000}, id: *uuid, case_id: *uuid, state: {type: string, enum: [draft, confirmed]}, version: *version}, description: 'Draft text may be empty; confirmation requires non-whitespace direction, focus and basis.'}
    FileUpload: {type: object, additionalProperties: false, required: [case_id, purpose, file], properties: {case_id: *uuid, purpose: {type: string, enum: [profile_material, task_evidence, sop_media, support_message]}, file: {type: string, format: binary}, task_id: *uuid}}
    FileAsset: {type: object, additionalProperties: false, required: [id, case_id, task_id, purpose, filename, mime_type, size_bytes, state, reason, width, height, version, created_at], properties: {id: *uuid, case_id: *uuid, task_id: *nullable_uuid, purpose: {type: string, enum: [profile_material, task_evidence, sop_media, support_message]}, filename: {type: string, minLength: 1, maxLength: 255}, mime_type: {type: string, minLength: 1, maxLength: 128}, size_bytes: {type: integer, minimum: 1, maximum: 20971520}, state: {type: string, enum: [quarantined, scanning, ready, rejected, deleted]}, reason: {anyOf: [{type: string, maxLength: 200}, {type: 'null'}]}, width: {anyOf: [{type: integer, minimum: 1, maximum: 20000}, {type: 'null'}]}, height: {anyOf: [{type: integer, minimum: 1, maximum: 20000}, {type: 'null'}]}, version: *version, created_at: *time}}
    PlanCreate: {type: object, additionalProperties: false, required: [title], properties: {title: {type: string, minLength: 1, maxLength: 120}}}
    SopPlan: {type: object, additionalProperties: false, required: [id, case_id, title, published_revision_id, draft_revision_id, version], properties: {id: *uuid, case_id: *uuid, title: {type: string, minLength: 1, maxLength: 120}, published_revision_id: *nullable_uuid, draft_revision_id: *nullable_uuid, version: *version}, description: 'Learner projection always returns draft_revision_id=null.'}
    RevisionCreate: {type: object, additionalProperties: false, required: [], properties: {base_revision_id: *nullable_uuid}}
    Reminder: {type: object, additionalProperties: false, required: [speech_enabled, vibration_enabled, prompt_level], properties: {speech_enabled: *bool, vibration_enabled: *bool, prompt_level: {type: integer, minimum: 1, maximum: 3}}}
    SopStep: {type: object, additionalProperties: false, required: [id, position, instruction, media_ids, estimated_seconds, evidence_required], properties: {id: *uuid, position: {type: integer, minimum: 1, maximum: 100}, instruction: {type: string, maxLength: 2000}, media_ids: *attachments, estimated_seconds: {type: integer, minimum: 0, maximum: 86400}, evidence_required: *bool}}
    RevisionWrite: {type: object, additionalProperties: false, required: [goal, steps, reminder], properties: {goal: {type: string, maxLength: 1000}, steps: {type: array, items: {$ref: '#/components/schemas/SopStep'}, maxItems: 100}, reminder: {$ref: '#/components/schemas/Reminder'}}, description: 'Draft may be incomplete. Publish requires 1-100 complete steps, unique IDs/positions, non-empty goal and ready media.'}
    SopRevision: {type: object, additionalProperties: false, required: [goal, steps, reminder, id, plan_id, revision_no, state, version, published_at], properties: {goal: {type: string, maxLength: 1000}, steps: {type: array, items: {$ref: '#/components/schemas/SopStep'}, maxItems: 100}, reminder: {$ref: '#/components/schemas/Reminder'}, id: *uuid, plan_id: *uuid, revision_no: *version, state: {type: string, enum: [draft, published, archived]}, version: *version, published_at: *nullable_time}, description: 'Draft may be incomplete. Publish requires 1-100 complete steps, unique IDs/positions, non-empty goal and ready media.'}
    PublishRequest: {type: object, additionalProperties: false, required: [due_on], properties: {due_on: {anyOf: [{type: string, format: date}, {type: 'null'}]}}}
    Publication: {type: object, additionalProperties: false, required: [revision_id, task_id, published_at], properties: {revision_id: *uuid, task_id: *uuid, published_at: *time}}
    StepProgress: {type: object, additionalProperties: false, required: [step_id, status, attachment_ids], properties: {step_id: *uuid, status: {type: string, enum: [pending, in_progress, completed]}, attachment_ids: *attachments}}
    PromptOverrideWrite: {type: object, additionalProperties: false, required: [prompt_level, reason], properties: {prompt_level: {type: integer, minimum: 1, maximum: 3}, reason: {type: string, minLength: 1, maxLength: 500}}, description: 'Task-level hints; learner quiet preference takes precedence.'}
    Task: {type: object, additionalProperties: false, required: [id, case_id, learner_id, title, revision, status, due_on, current_step_id, progress, prompt_override, version], properties: {id: *uuid, case_id: *uuid, learner_id: *uuid, title: {type: string, minLength: 1, maxLength: 120}, revision: {$ref: '#/components/schemas/SopRevision'}, status: *task_status, due_on: {anyOf: [{type: string, format: date}, {type: 'null'}]}, current_step_id: *nullable_uuid, progress: {type: array, items: {$ref: '#/components/schemas/StepProgress'}, maxItems: 100}, prompt_override: {anyOf: [{$ref: '#/components/schemas/PromptOverrideWrite'}, {type: 'null'}]}, version: *version}}
    TaskAction: {type: object, additionalProperties: false, required: [action], properties: {action: {type: string, enum: [start, pause, resume, cancel]}, reason: {type: string, maxLength: 500}}, allOf: [{if: {properties: {action: {const: cancel}}}, then: {required: [reason], properties: {reason: {minLength: 1, pattern: '\S'}}}}]}
    ProgressWrite: {type: object, additionalProperties: false, required: [status, attachment_ids], properties: {status: {type: string, enum: [in_progress, completed]}, attachment_ids: *attachments}}
    TaskEvent: {type: object, additionalProperties: false, required: [event_id, session_id, sequence, step_id, kind, value, observed_at], properties: {event_id: *uuid, session_id: *uuid, sequence: *version, step_id: *uuid, kind: {type: string, enum: [hint_requested, self_reported_error, time_sample]}, value: {type: integer, minimum: 0, maximum: 86400000}, observed_at: *time}, description: 'Observation only. Cumulative time per session and step; deduplicate event_id.'}
    EventBatch: {type: object, additionalProperties: false, required: [events], properties: {events: {type: array, items: {$ref: '#/components/schemas/TaskEvent'}, maxItems: 100, minItems: 1}}}
    EventReceipt: {type: object, additionalProperties: false, required: [accepted, duplicates], properties: {accepted: {type: integer, minimum: 0, maximum: 100}, duplicates: {type: integer, minimum: 0, maximum: 100}}}
    SubmissionCreate: {type: object, additionalProperties: false, required: [note], properties: {note: {type: string, maxLength: 500}}}
    SubmissionSnapshot: {type: object, additionalProperties: false, required: [schema_version, revision_id, progress], properties: {schema_version: {type: integer, const: 1}, revision_id: *uuid, progress: {type: array, items: {$ref: '#/components/schemas/StepProgress'}, maxItems: 100}}}
    FeedbackCreate: {type: object, additionalProperties: false, required: [outcome, message, tags, redo_step_ids, annotation_ids], properties: {outcome: {type: string, enum: [passed, changes_requested]}, message: {type: string, minLength: 1, maxLength: 500}, tags: {type: array, items: {type: string, enum: [title_correct, naming_adjustment, retake_required, other]}, maxItems: 5}, redo_step_ids: {type: array, items: *uuid, maxItems: 100}, annotation_ids: {type: array, items: *uuid, maxItems: 20}}, allOf: [{if: {properties: {outcome: {const: changes_requested}}}, then: {properties: {redo_step_ids: {minItems: 1}}}, else: {properties: {redo_step_ids: {maxItems: 0}}}}]}
    Feedback: {type: object, additionalProperties: false, required: [outcome, message, tags, redo_step_ids, annotation_ids, id, submission_id, author_id, created_at], properties: {outcome: {type: string, enum: [passed, changes_requested]}, message: {type: string, minLength: 1, maxLength: 500}, tags: {type: array, items: {type: string, enum: [title_correct, naming_adjustment, retake_required, other]}, maxItems: 5}, redo_step_ids: {type: array, items: *uuid, maxItems: 100}, annotation_ids: {type: array, items: *uuid, maxItems: 20}, id: *uuid, submission_id: *uuid, author_id: *uuid, created_at: *time}, allOf: [{if: {properties: {outcome: {const: changes_requested}}}, then: {properties: {redo_step_ids: {minItems: 1}}}, else: {properties: {redo_step_ids: {maxItems: 0}}}}]}
    Submission: {type: object, additionalProperties: false, required: [id, task_id, attempt_no, revision_id, note, snapshot, submitted_at, task_version, task_status, feedback], properties: {id: *uuid, task_id: *uuid, attempt_no: *version, revision_id: *uuid, note: {type: string, maxLength: 500}, snapshot: {$ref: '#/components/schemas/SubmissionSnapshot'}, submitted_at: *time, task_version: *version, task_status: *task_status, feedback: {anyOf: [{$ref: '#/components/schemas/Feedback'}, {type: 'null'}]}}, description: 'Immutable snapshot plus current parent task version/status; ETag tracks task_version.'}
    FeedbackResult: {type: object, additionalProperties: false, required: [feedback, task], properties: {feedback: {$ref: '#/components/schemas/Feedback'}, task: {$ref: '#/components/schemas/Task'}}}
    PointMarker: {type: object, additionalProperties: false, required: [id, x, y, text, shape], properties: {id: *uuid, x: {type: number, minimum: 0, maximum: 1}, y: {type: number, minimum: 0, maximum: 1}, text: {type: string, minLength: 1, maxLength: 200}, shape: {type: string, const: point}}}
    RectMarker: {type: object, additionalProperties: false, required: [id, x, y, text, shape, width, height], properties: {id: *uuid, x: {type: number, minimum: 0, maximum: 1}, y: {type: number, minimum: 0, maximum: 1}, text: {type: string, minLength: 1, maxLength: 200}, shape: {type: string, const: rect}, width: {type: number, exclusiveMinimum: 0, maximum: 1}, height: {type: number, exclusiveMinimum: 0, maximum: 1}}, description: 'Server additionally validates x+width<=1 and y+height<=1.'}
    Marker: {oneOf: [{$ref: '#/components/schemas/PointMarker'}, {$ref: '#/components/schemas/RectMarker'}], discriminator: {propertyName: shape, mapping: {point: '#/components/schemas/PointMarker', rect: '#/components/schemas/RectMarker'}}}
    AnnotationCreate: {type: object, additionalProperties: false, required: [asset_id, submission_id, kind, markers], properties: {asset_id: *uuid, submission_id: *nullable_uuid, kind: {type: string, enum: [question, guidance]}, markers: {type: array, items: {$ref: '#/components/schemas/Marker'}, maxItems: 100, minItems: 1}}}
    AnnotationWrite: {type: object, additionalProperties: false, required: [markers], properties: {markers: {type: array, items: {$ref: '#/components/schemas/Marker'}, maxItems: 100, minItems: 1}}}
    Annotation: {type: object, additionalProperties: false, required: [id, task_id, submission_id, asset_id, author_id, kind, markers, state, version], properties: {id: *uuid, task_id: *uuid, submission_id: *nullable_uuid, asset_id: *uuid, author_id: *uuid, kind: {type: string, enum: [question, guidance]}, markers: {type: array, items: {$ref: '#/components/schemas/Marker'}, maxItems: 100, minItems: 1}, state: {type: string, enum: [draft, published]}, version: *version}}
    AssistanceCreate: {type: object, additionalProperties: false, required: [case_id, task_id, step_id, message, attachment_ids, preferred_mode], properties: {case_id: *uuid, task_id: *nullable_uuid, step_id: *nullable_uuid, message: {type: string, minLength: 1, maxLength: 500}, attachment_ids: *attachments, preferred_mode: {type: string, enum: [text, annotation]}}}
    Assistance: {type: object, additionalProperties: false, required: [case_id, task_id, step_id, message, attachment_ids, preferred_mode, id, counselor_id, state, version, created_at], properties: {case_id: *uuid, task_id: *nullable_uuid, step_id: *nullable_uuid, message: {type: string, minLength: 1, maxLength: 500}, attachment_ids: *attachments, preferred_mode: {type: string, enum: [text, annotation]}, id: *uuid, counselor_id: *uuid, state: {type: string, enum: [queued, accepted, resolved, cancelled]}, version: *version, created_at: *time}}
    AssistanceAction: {type: object, additionalProperties: false, required: [action], properties: {action: {type: string, enum: [accept, resolve, cancel]}, note: {type: string, maxLength: 500}}}
    MessageCreate: {type: object, additionalProperties: false, required: [body, attachment_ids], properties: {body: {type: string, maxLength: 2000}, attachment_ids: *attachments}, anyOf: [{properties: {body: {minLength: 1, pattern: '\S'}}}, {properties: {attachment_ids: {minItems: 1}}}]}
    SupportMessage: {type: object, additionalProperties: false, required: [body, attachment_ids, id, request_id, author_id, created_at], properties: {body: {type: string, maxLength: 2000}, attachment_ids: *attachments, id: *uuid, request_id: *uuid, author_id: *uuid, created_at: *time}, anyOf: [{properties: {body: {minLength: 1, pattern: '\S'}}}, {properties: {attachment_ids: {minItems: 1}}}]}
    Notification: {type: object, additionalProperties: false, required: [id, seq, type, resource_type, resource_id, created_at, read_at], properties: {id: *uuid, seq: {type: string, maxLength: 20, pattern: '^(0|[1-9][0-9]*)$'}, type: {type: string, minLength: 1, maxLength: 80}, resource_type: {type: string, enum: [task, submission, assistance, annotation, file, case]}, resource_id: *uuid, created_at: *time, read_at: *nullable_time}}
    NotificationPage: {type: object, additionalProperties: false, required: [items, next_seq, has_more], properties: {items: {type: array, items: {$ref: '#/components/schemas/Notification'}, maxItems: 100}, next_seq: {type: string, maxLength: 20, pattern: '^(0|[1-9][0-9]*)$'}, has_more: *bool}}
    TrainingRecord: {type: object, additionalProperties: false, required: [task_id, title, status, attempts, hint_requests, assistance_requests, observed_elapsed_ms, measurement_note], properties: {task_id: *uuid, title: {type: string, minLength: 1, maxLength: 120}, status: *task_status, attempts: *count, hint_requests: *count, assistance_requests: *count, observed_elapsed_ms: {anyOf: [*count, {type: 'null'}]}, measurement_note: {type: string, maxLength: 500}}}
    CasePage: {type: object, additionalProperties: false, required: [items, next_cursor, has_more], properties: {items: {type: array, items: {$ref: '#/components/schemas/Case'}, maxItems: 100}, next_cursor: {anyOf: [{type: string, maxLength: 512}, {type: 'null'}]}, has_more: *bool}}
    FilePage: {type: object, additionalProperties: false, required: [items, next_cursor, has_more], properties: {items: {type: array, items: {$ref: '#/components/schemas/FileAsset'}, maxItems: 100}, next_cursor: {anyOf: [{type: string, maxLength: 512}, {type: 'null'}]}, has_more: *bool}}
    PlanPage: {type: object, additionalProperties: false, required: [items, next_cursor, has_more], properties: {items: {type: array, items: {$ref: '#/components/schemas/SopPlan'}, maxItems: 100}, next_cursor: {anyOf: [{type: string, maxLength: 512}, {type: 'null'}]}, has_more: *bool}}
    TaskPage: {type: object, additionalProperties: false, required: [items, next_cursor, has_more], properties: {items: {type: array, items: {$ref: '#/components/schemas/Task'}, maxItems: 100}, next_cursor: {anyOf: [{type: string, maxLength: 512}, {type: 'null'}]}, has_more: *bool}}
    SubmissionPage: {type: object, additionalProperties: false, required: [items, next_cursor, has_more], properties: {items: {type: array, items: {$ref: '#/components/schemas/Submission'}, maxItems: 100}, next_cursor: {anyOf: [{type: string, maxLength: 512}, {type: 'null'}]}, has_more: *bool}}
    AnnotationPage: {type: object, additionalProperties: false, required: [items, next_cursor, has_more], properties: {items: {type: array, items: {$ref: '#/components/schemas/Annotation'}, maxItems: 100}, next_cursor: {anyOf: [{type: string, maxLength: 512}, {type: 'null'}]}, has_more: *bool}}
    AssistancePage: {type: object, additionalProperties: false, required: [items, next_cursor, has_more], properties: {items: {type: array, items: {$ref: '#/components/schemas/Assistance'}, maxItems: 100}, next_cursor: {anyOf: [{type: string, maxLength: 512}, {type: 'null'}]}, has_more: *bool}}
    MessagePage: {type: object, additionalProperties: false, required: [items, next_cursor, has_more], properties: {items: {type: array, items: {$ref: '#/components/schemas/SupportMessage'}, maxItems: 100}, next_cursor: {anyOf: [{type: string, maxLength: 512}, {type: 'null'}]}, has_more: *bool}}
    RecordPage: {type: object, additionalProperties: false, required: [items, next_cursor, has_more], properties: {items: {type: array, items: {$ref: '#/components/schemas/TrainingRecord'}, maxItems: 100}, next_cursor: {anyOf: [{type: string, maxLength: 512}, {type: 'null'}]}, has_more: *bool}}
paths:
  /health/live:
    get: {operationId: health_live, summary: 存活检查, x-phase: M1, security: [], responses: {'200': {description: 存活检查, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}, default: *error}}
  /health/ready:
    get: {operationId: health_ready, summary: 就绪检查, x-phase: M1, security: [], responses: {'200': {description: 就绪检查, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}, default: *error, '503': *error}}
  /auth/csrf:
    get: {operationId: auth_csrf, summary: 获取会话 CSRF, x-phase: M2, security: [], responses: {'200': {description: 获取会话 CSRF, content: {application/json: {schema: {$ref: '#/components/schemas/CsrfToken'}}}}, default: *error}}
  /auth/login:
    post: {operationId: auth_login, summary: 登录并轮换会话, x-phase: M2, parameters: [*CSRF], security: [], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}, responses: {'200': {description: 登录并轮换会话, content: {application/json: {schema: {$ref: '#/components/schemas/LoginResult'}}}}, default: *error}}
  /auth/logout:
