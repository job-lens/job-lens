<text x="897.5" y="299" font-size="22" font-weight="600" text-anchor="middle">小程序 / App</text>
<text x="897.5" y="330" font-size="18" text-anchor="middle">后续客户端</text>
<text x="897.5" y="358" font-size="18" text-anchor="middle">平台登录与设备适配</text>
<path d="M235 195 L235 230 L400 230 L400 265" fill="none" stroke="#45677E" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="262" y="206" width="84" height="25" fill="white"/>
<text x="304" y="223" font-size="18" text-anchor="middle">执行训练</text>
