<text x="495" y="489" font-size="25" font-weight="600" text-anchor="middle">业务 API</text>
<text x="495" y="520" font-size="18" text-anchor="middle">容器 · Python / FastAPI</text>
<text x="495" y="548" font-size="18" text-anchor="middle">权限、状态、事务与通知</text>
