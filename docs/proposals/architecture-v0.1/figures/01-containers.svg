<text x="485" y="299" font-size="25" font-weight="600" text-anchor="middle">Web 应用</text>
<text x="485" y="330" font-size="18" text-anchor="middle">容器 · React / TypeScript</text>
<text x="485" y="358" font-size="18" text-anchor="middle">学员区 + 辅导员区</text>
