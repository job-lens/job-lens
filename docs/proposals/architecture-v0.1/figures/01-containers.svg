<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1050" viewBox="0 0 1040 1050" role="img" aria-label="融职境｜总体架构">
<title>融职境｜总体架构</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#45677E"/></marker></defs>
<rect width="1040" height="1050" fill="white"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif" fill="#17334D" font-weight="400">
<text x="32" y="44" font-size="30" font-weight="600" text-anchor="start">融职境｜总体架构</text>
<text x="32" y="76" font-size="18" fill="#45677E" text-anchor="start">容器视图 · 当前 Web 与后续客户端共用业务接口</text>
