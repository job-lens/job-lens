<text x="235" y="139" font-size="23" font-weight="600" text-anchor="middle">学员</text>
<text x="235" y="170" font-size="18" text-anchor="middle">人员 · 建档、训练、提交与求助</text>
<rect x="445" y="105" width="310" height="90" rx="7" fill="#F5F6F7" stroke="#45677E" stroke-width="1.6"/>
<text x="600" y="139" font-size="23" font-weight="600" text-anchor="middle">辅导员</text>
<text x="600" y="170" font-size="18" text-anchor="middle">人员 · 匹配、SOP 与辅导反馈</text>
