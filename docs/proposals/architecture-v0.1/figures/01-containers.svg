<rect x="705.1" y="597" width="209.8" height="25" fill="white"/>
<text x="810" y="614" font-size="18" text-anchor="middle">授权文件读写 · HTTPS</text>
<path d="M340 912 L180 912 L180 785" fill="none" stroke="#45677E" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="65" y="824" width="238.1" height="25" fill="white"/>
<text x="184" y="841" font-size="18" text-anchor="middle">领取作业 / 写结果 · SQL</text>
<path d="M700 912 L860 912 L860 785" fill="none" stroke="#45677E" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="771.1" y="824" width="173.8" height="25" fill="white"/>
<text x="858" y="841" font-size="18" text-anchor="middle">处理文件 · HTTPS</text>
<line x1="32" y1="991" x2="1008" y2="991" stroke="#CDD6DD"/>
<text x="32" y="1021" font-size="17" fill="#45677E" text-anchor="start">图例：蓝色=应用容器；绿色=数据存储；灰色=人员/后续客户端；虚线箭头=后续接入。</text>
</g></svg>