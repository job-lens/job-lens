openapi: 3.1.1
info:
  title: Job Lens / 融职境 API
  version: 0.1.0
  description: Resource authorization, state transitions and HTTP conventions are defined in docs/development.md. Implementation coverage is tracked separately from this contract.
servers: [{url: /api/v1}]
security: [{WebSession: []}]
x-scalars:
  uuid: &uuid {type: string, format: uuid}
  nullable_uuid: &nullable_uuid {type: [string, 'null'], format: uuid}
  time: &time {type: string, format: date-time}
  nullable_time: &nullable_time {type: [string, 'null'], format: date-time}
  date: &date {type: [string, 'null'], format: date}
  version: &version {type: integer, minimum: 1, maximum: 2147483647}
  count: &count {type: integer, minimum: 0, maximum: 2147483647}
  bool: &bool {type: boolean}
  attachments: &attachments {type: array, items: *uuid, maxItems: 5}
  task_status: &task_status {type: string, enum: [not_started, in_progress, paused, submitted, changes_requested, completed, cancelled]}
  seq: &seq {type: string, pattern: '^(0|[1-9][0-9]*)$', maxLength: 20}
components:
  securitySchemes:
    WebSession: {type: apiKey, in: cookie, name: __Host-jl_session, description: "Opaque server-side session; Secure/HttpOnly/SameSite=Lax. All writes also validate CSRF and Origin."}
  parameters:
    CSRF: &csrf {name: X-CSRF-Token, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 256}}
    Idempotency: &idem {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$'}}
    IfMatch: &match {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"[1-9][0-9]*"$'}}
    Limit: &limit {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Cursor: &cursor {name: cursor, in: query, schema: {type: string, maxLength: 512}}
    AfterSeq: &after {name: after_seq, in: query, schema: {<<: *seq, default: '0'}}
    LastEventId: &last {name: Last-Event-ID, in: header, schema: *seq}
  headers:
    ETag: &etag {description: "Quoted resource version. Task child commands use the current task version, including the Submission task_version projection.", schema: {type: string, pattern: '^"[1-9][0-9]*"$'}}
  responses:
    Problem: &problem
      description: See docs/development.md for 400/401/403/404/409/410/412/413/415/422/428/429/503 conditions and stable business codes.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, trace_id]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string, minLength: 1, maxLength: 100}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string, minLength: 1, maxLength: 80}
        detail: {type: string, maxLength: 2000}
        trace_id: {type: string, minLength: 1, maxLength: 128}
        errors: {type: array, maxItems: 100, items: {type: object, additionalProperties: false, required: [field, reason], properties: {field: {type: string, maxLength: 200}, reason: {type: string, maxLength: 200}}}}
        resource_id: *uuid
    Health: {type: object, additionalProperties: false, required: [status], properties: {status: {type: string, enum: [ok]}}}
    CsrfToken: {type: object, additionalProperties: false, required: [csrf_token], properties: {csrf_token: {type: string, minLength: 16, maxLength: 256}}}
    LoginRequest: {type: object, additionalProperties: false, required: [login_name, password], properties: {login_name: {type: string, minLength: 1, maxLength: 80}, password: {type: string, minLength: 1, maxLength: 256}}}
    User: {type: object, additionalProperties: false, required: [id, display_name, roles], properties: {id: *uuid, display_name: {type: string, minLength: 1, maxLength: 80}, roles: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {type: string, enum: [learner, counselor]}}}}
    LoginResult: {type: object, additionalProperties: false, required: [user, csrf_token], properties: {user: {$ref: '#/components/schemas/User'}, csrf_token: {type: string, minLength: 16, maxLength: 256}}}
    PreferencesWrite: &prefs
      type: object
      additionalProperties: false
      required: [font_scale, volume, quiet_mode, speech_enabled, vibration_enabled]
      properties: &pref_props
        font_scale: {type: number, enum: [1, 1.25, 1.5]}
        volume: {type: number, minimum: 0, maximum: 1}
        quiet_mode: *bool
        speech_enabled: *bool
        vibration_enabled: *bool
    Preferences: {<<: *prefs, required: [font_scale, volume, quiet_mode, speech_enabled, vibration_enabled, version], properties: {<<: *pref_props, version: *version}}
    ProfileWrite: &profile
      type: object
      additionalProperties: false
      required: [display_name, sensory_preferences, communication_preference, work_notes]
      properties: &profile_props
        display_name: {type: string, minLength: 1, maxLength: 80}
        sensory_preferences: {type: array, maxItems: 10, items: {type: string, minLength: 1, maxLength: 40}}
        communication_preference: {type: string, maxLength: 200}
        work_notes: {type: string, maxLength: 1000}
    Profile: {<<: *profile, required: [display_name, sensory_preferences, communication_preference, work_notes, user_id, version], properties: {<<: *profile_props, user_id: *uuid, version: *version}}
    CaseProfile: {<<: *profile, required: [display_name, sensory_preferences, communication_preference, work_notes, user_id, version, preferences], properties: {<<: *profile_props, user_id: *uuid, version: *version, preferences: {$ref: '#/components/schemas/Preferences'}}}
    Capabilities: {type: object, additionalProperties: false, required: [screenshot_annotation, realtime_calls, sop_conversion, realtime_ar, precise_location], properties: {screenshot_annotation: *bool, realtime_calls: *bool, sop_conversion: *bool, realtime_ar: *bool, precise_location: *bool}}
    Dashboard: {type: object, additionalProperties: false, required: [view, pending_tasks, pending_feedback, pending_assistance, as_of], properties: {view: {type: string, enum: [learner, counselor]}, pending_tasks: *count, pending_feedback: *count, pending_assistance: *count, as_of: *time}}
    Case: {type: object, additionalProperties: false, required: [id, learner_id, counselor_id, lifecycle, display_status, current_task_id, version], properties: {id: *uuid, learner_id: *uuid, counselor_id: *nullable_uuid, lifecycle: {type: string, enum: [pending_match, active, closed]}, display_status: {type: string, enum: [pending_match, sop_pending, training, awaiting_feedback, feedback_available, stage_complete, closed]}, current_task_id: *nullable_uuid, version: *version}}
    MatchWrite: &match_model
      type: object
      additionalProperties: false
      required: [direction, focus, cycle_weeks, basis]
      description: Draft strings may be empty; confirmation requires non-whitespace direction, focus and basis.
      properties: &match_props
        direction: {type: string, maxLength: 80}
        focus: {type: string, maxLength: 500}
        cycle_weeks: {type: integer, minimum: 1, maximum: 52}
        basis: {type: string, maxLength: 1000}
    SupportMatch: {<<: *match_model, required: [direction, focus, cycle_weeks, basis, id, case_id, state, version], properties: {<<: *match_props, id: *uuid, case_id: *uuid, state: {type: string, enum: [draft, confirmed]}, version: *version}}
    FileUpload: {type: object, additionalProperties: false, required: [case_id, purpose, file], properties: {case_id: *uuid, task_id: *uuid, purpose: {type: string, enum: [profile_material, task_evidence, sop_media, support_message]}, file: {type: string, format: binary}}}
    FileAsset:
      type: object
      additionalProperties: false
      required: [id, case_id, task_id, purpose, filename, mime_type, size_bytes, state, reason, width, height, version, created_at]
      properties:
        id: *uuid
        case_id: *uuid
        task_id: *nullable_uuid
        purpose: {type: string, enum: [profile_material, task_evidence, sop_media, support_message]}
        filename: {type: string, minLength: 1, maxLength: 255}
        mime_type: {type: string, minLength: 1, maxLength: 128}
        size_bytes: {type: integer, minimum: 1, maximum: 20971520}
        state: {type: string, enum: [quarantined, scanning, ready, rejected, deleted]}
        reason: {type: [string, 'null'], maxLength: 200}
        width: {type: [integer, 'null'], minimum: 1, maximum: 20000}
        height: {type: [integer, 'null'], minimum: 1, maximum: 20000}
        version: *version
        created_at: *time
    PlanCreate: {type: object, additionalProperties: false, required: [title], properties: {title: {type: string, minLength: 1, maxLength: 120}}}
    SopPlan: {type: object, additionalProperties: false, required: [id, case_id, title, published_revision_id, draft_revision_id, version], description: "Learner projection always returns draft_revision_id=null.", properties: {id: *uuid, case_id: *uuid, title: {type: string, minLength: 1, maxLength: 120}, published_revision_id: *nullable_uuid, draft_revision_id: *nullable_uuid, version: *version}}
    RevisionCreate: {type: object, additionalProperties: false, properties: {base_revision_id: *nullable_uuid}}
    Reminder: {type: object, additionalProperties: false, required: [speech_enabled, vibration_enabled, prompt_level], properties: {speech_enabled: *bool, vibration_enabled: *bool, prompt_level: {type: integer, minimum: 1, maximum: 3}}}
    SopStep: {type: object, additionalProperties: false, required: [id, position, instruction, media_ids, estimated_seconds, evidence_required], properties: {id: *uuid, position: {type: integer, minimum: 1, maximum: 100}, instruction: {type: string, maxLength: 2000}, media_ids: *attachments, estimated_seconds: {type: integer, minimum: 0, maximum: 86400}, evidence_required: *bool}}
    RevisionWrite: &revision
      type: object
      additionalProperties: false
      required: [goal, steps, reminder]
      description: Draft may be incomplete. Publish requires 1-100 complete steps, unique IDs/positions, non-empty goal and ready media.
      properties: &revision_props
        goal: {type: string, maxLength: 1000}
        steps: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/SopStep'}}
        reminder: {$ref: '#/components/schemas/Reminder'}
    SopRevision: {<<: *revision, required: [goal, steps, reminder, id, plan_id, revision_no, state, version, published_at], properties: {<<: *revision_props, id: *uuid, plan_id: *uuid, revision_no: *version, state: {type: string, enum: [draft, published, archived]}, version: *version, published_at: *nullable_time}}
    PublishRequest: {type: object, additionalProperties: false, required: [due_on], properties: {due_on: *date}}
    Publication: {type: object, additionalProperties: false, required: [revision_id, task_id, published_at], properties: {revision_id: *uuid, task_id: *uuid, published_at: *time}}
    StepProgress: {type: object, additionalProperties: false, required: [step_id, status, attachment_ids], properties: {step_id: *uuid, status: {type: string, enum: [pending, in_progress, completed]}, attachment_ids: *attachments}}
    PromptOverrideWrite: {type: object, additionalProperties: false, required: [prompt_level, reason], properties: {prompt_level: {type: integer, minimum: 1, maximum: 3}, reason: {type: string, minLength: 1, maxLength: 500}}, description: "Task-level text hints only; cannot override quiet mode or immutable SOP content."}
    Task:
      type: object
      additionalProperties: false
      required: [id, case_id, learner_id, title, revision, status, due_on, current_step_id, progress, prompt_override, version]
      properties:
        id: *uuid
        case_id: *uuid
        learner_id: *uuid
        title: {type: string, minLength: 1, maxLength: 120}
        revision: {$ref: '#/components/schemas/SopRevision'}
        status: *task_status
        due_on: *date
        current_step_id: *nullable_uuid
        progress: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/StepProgress'}}
        prompt_override: {anyOf: [{$ref: '#/components/schemas/PromptOverrideWrite'}, {type: 'null'}]}
        version: *version
    TaskAction:
      type: object
      additionalProperties: false
      required: [action]
      properties: {action: {type: string, enum: [start, pause, resume, cancel]}, reason: {type: string, maxLength: 500}}
      allOf: [{if: {properties: {action: {const: cancel}}}, then: {required: [reason], properties: {reason: {minLength: 1, pattern: '\S'}}}}]
    ProgressWrite: {type: object, additionalProperties: false, required: [status, attachment_ids], properties: {status: {type: string, enum: [in_progress, completed]}, attachment_ids: *attachments}}
    TaskEvent: {type: object, additionalProperties: false, required: [event_id, session_id, sequence, step_id, kind, value, observed_at], properties: {event_id: *uuid, session_id: *uuid, sequence: *version, step_id: *uuid, kind: {type: string, enum: [hint_requested, self_reported_error, time_sample]}, value: {type: integer, minimum: 0, maximum: 86400000}, observed_at: *time}, description: "Observation only. Time samples are cumulative per session/step, not additive. IDs deduplicate."}
    EventBatch: {type: object, additionalProperties: false, required: [events], properties: {events: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/TaskEvent'}}}}
    EventReceipt: {type: object, additionalProperties: false, required: [accepted, duplicates], properties: {accepted: {type: integer, minimum: 0, maximum: 100}, duplicates: {type: integer, minimum: 0, maximum: 100}}}
    SubmissionCreate: {type: object, additionalProperties: false, required: [note], properties: {note: {type: string, maxLength: 500}}}
    SubmissionSnapshot: {type: object, additionalProperties: false, required: [schema_version, revision_id, progress], properties: {schema_version: {type: integer, const: 1}, revision_id: *uuid, progress: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/StepProgress'}}}}
    FeedbackCreate: &feedback
      type: object
      additionalProperties: false
      required: [outcome, message, tags, redo_step_ids, annotation_ids]
      properties: &feedback_props
        outcome: {type: string, enum: [passed, changes_requested]}
        message: {type: string, minLength: 1, maxLength: 500}
        tags: {type: array, maxItems: 5, items: {type: string, enum: [title_correct, naming_adjustment, retake_required, other]}}
        redo_step_ids: {type: array, maxItems: 100, items: *uuid}
        annotation_ids: {type: array, maxItems: 20, items: *uuid}
      allOf: [{if: {properties: {outcome: {const: changes_requested}}}, then: {properties: {redo_step_ids: {minItems: 1}}}, else: {properties: {redo_step_ids: {maxItems: 0}}}}]
    Feedback: {<<: *feedback, required: [outcome, message, tags, redo_step_ids, annotation_ids, id, submission_id, author_id, created_at], properties: {<<: *feedback_props, id: *uuid, submission_id: *uuid, author_id: *uuid, created_at: *time}}
    Submission:
      type: object
      additionalProperties: false
      required: [id, task_id, attempt_no, revision_id, note, snapshot, submitted_at, task_version, task_status, feedback]
      description: Snapshot immutable; current parent task_version and task_status determine the ETag used for feedback.
      properties:
        id: *uuid
        task_id: *uuid
        attempt_no: *version
        revision_id: *uuid
        note: {type: string, maxLength: 500}
        snapshot: {$ref: '#/components/schemas/SubmissionSnapshot'}
        submitted_at: *time
        task_version: *version
        task_status: *task_status
        feedback: {anyOf: [{$ref: '#/components/schemas/Feedback'}, {type: 'null'}]}
    FeedbackResult: {type: object, additionalProperties: false, required: [feedback, task], properties: {feedback: {$ref: '#/components/schemas/Feedback'}, task: {$ref: '#/components/schemas/Task'}}}
    PointMarker:
      type: object
      additionalProperties: false
      required: [id, x, y, text, shape]
      properties: &point_props
        id: *uuid
        x: {type: number, minimum: 0, maximum: 1}
        y: {type: number, minimum: 0, maximum: 1}
        text: {type: string, minLength: 1, maxLength: 200}
        shape: {type: string, const: point}
    RectMarker: {type: object, additionalProperties: false, required: [id, x, y, text, shape, width, height], properties: {<<: *point_props, shape: {type: string, const: rect}, width: {type: number, exclusiveMinimum: 0, maximum: 1}, height: {type: number, exclusiveMinimum: 0, maximum: 1}}, description: "Server additionally enforces x+width<=1 and y+height<=1 against normalized image dimensions."}
    Marker: {oneOf: [{$ref: '#/components/schemas/PointMarker'}, {$ref: '#/components/schemas/RectMarker'}], discriminator: {propertyName: shape, mapping: {point: '#/components/schemas/PointMarker', rect: '#/components/schemas/RectMarker'}}}
    AnnotationCreate: {type: object, additionalProperties: false, required: [asset_id, submission_id, kind, markers], properties: {asset_id: *uuid, submission_id: *nullable_uuid, kind: {type: string, enum: [question, guidance]}, markers: &markers {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/Marker'}}}}
    AnnotationWrite: {type: object, additionalProperties: false, required: [markers], properties: {markers: *markers}}
    Annotation: {type: object, additionalProperties: false, required: [id, task_id, submission_id, asset_id, author_id, kind, markers, state, version], properties: {id: *uuid, task_id: *uuid, submission_id: *nullable_uuid, asset_id: *uuid, author_id: *uuid, kind: {type: string, enum: [question, guidance]}, markers: *markers, state: {type: string, enum: [draft, published]}, version: *version}}
    AssistanceCreate: &assistance
      type: object
      additionalProperties: false
      required: [case_id, task_id, step_id, message, attachment_ids, preferred_mode]
      properties: &assistance_props
        case_id: *uuid
        task_id: *nullable_uuid
        step_id: *nullable_uuid
        message: {type: string, minLength: 1, maxLength: 500}
        attachment_ids: *attachments
        preferred_mode: {type: string, enum: [text, annotation]}
    Assistance: {<<: *assistance, required: [case_id, task_id, step_id, message, attachment_ids, preferred_mode, id, counselor_id, state, version, created_at], properties: {<<: *assistance_props, id: *uuid, counselor_id: *uuid, state: {type: string, enum: [queued, accepted, resolved, cancelled]}, version: *version, created_at: *time}}
    AssistanceAction: {type: object, additionalProperties: false, required: [action], properties: {action: {type: string, enum: [accept, resolve, cancel]}, note: {type: string, maxLength: 500}}}
    MessageCreate: &message
      type: object
      additionalProperties: false
      required: [body, attachment_ids]
      properties: &message_props {body: {type: string, maxLength: 2000}, attachment_ids: *attachments}
      anyOf: [{properties: {body: {minLength: 1, pattern: '\S'}}}, {properties: {attachment_ids: {minItems: 1}}}]
    SupportMessage: {<<: *message, required: [body, attachment_ids, id, request_id, author_id, created_at], properties: {<<: *message_props, id: *uuid, request_id: *uuid, author_id: *uuid, created_at: *time}}
    Notification: {type: object, additionalProperties: false, required: [id, seq, type, resource_type, resource_id, created_at, read_at], properties: {id: *uuid, seq: *seq, type: {type: string, minLength: 1, maxLength: 80}, resource_type: {type: string, enum: [task, submission, assistance, annotation, file, case]}, resource_id: *uuid, created_at: *time, read_at: *nullable_time}}
    NotificationPage: {type: object, additionalProperties: false, required: [items, next_seq, has_more], properties: {items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Notification'}}, next_seq: *seq, has_more: *bool}}
    TrainingRecord: {type: object, additionalProperties: false, required: [task_id, title, status, attempts, hint_requests, assistance_requests, observed_elapsed_ms, measurement_note], properties: {task_id: *uuid, title: {type: string, minLength: 1, maxLength: 120}, status: *task_status, attempts: *count, hint_requests: *count, assistance_requests: *count, observed_elapsed_ms: {type: [integer, 'null'], minimum: 0, maximum: 2147483647}, measurement_note: {type: string, maxLength: 500}}}
    CasePage: &page
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties: &page_props
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Case'}}
        next_cursor: {type: [string, 'null'], maxLength: 512}
        has_more: *bool
    FilePage: {<<: *page, properties: {<<: *page_props, items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/FileAsset'}}}}
    PlanPage: {<<: *page, properties: {<<: *page_props, items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/SopPlan'}}}}
    TaskPage: {<<: *page, properties: {<<: *page_props, items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Task'}}}}
    SubmissionPage: {<<: *page, properties: {<<: *page_props, items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Submission'}}}}
    AnnotationPage: {<<: *page, properties: {<<: *page_props, items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Annotation'}}}}
    AssistancePage: {<<: *page, properties: {<<: *page_props, items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Assistance'}}}}
    MessagePage: {<<: *page, properties: {<<: *page_props, items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/SupportMessage'}}}}
    RecordPage: {<<: *page, properties: {<<: *page_props, items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/TrainingRecord'}}}}
x-header-sets:
  write: &write_headers [*csrf, *idem]
  command: &command_headers [*csrf, *idem, *match]
  put: &put_headers [*csrf, *match]
  list: &list_params [*limit, *cursor]
x-common-errors: &errors
  '401': {$ref: '#/components/responses/Problem'}
  '403': {$ref: '#/components/responses/Problem'}
  '404': {$ref: '#/components/responses/Problem'}
  default: {$ref: '#/components/responses/Problem'}
paths:
  /health/live:
    get: {operationId: health_live, summary: 存活检查, x-phase: M1, security: [], responses: {'200': {description: "Alive", content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}, default: *problem}}
  /health/ready:
    get: {operationId: health_ready, summary: 就绪检查, x-phase: M1, security: [], responses: {'200': {description: "Ready", content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}, '503': *problem, default: *problem}}
  /auth/csrf:
    get: {operationId: auth_csrf, summary: 获取预登录或当前会话CSRF凭据, x-phase: M2, security: [], responses: {'200': {description: "CSRF token; no-store", content: {application/json: {schema: {$ref: '#/components/schemas/CsrfToken'}}}}, default: *problem}}
  /auth/login:
    post: {operationId: auth_login, summary: 账号登录并轮换会话, x-phase: M2, security: [], parameters: [*csrf], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}, responses: {<<: *errors, '200': {description: "User and rotated CSRF; session in HttpOnly cookie", content: {application/json: {schema: {$ref: '#/components/schemas/LoginResult'}}}}}}
  /auth/logout:
    post: {operationId: auth_logout, summary: 撤销当前会话, x-phase: M2, parameters: [*csrf], responses: {<<: *errors, '204': {description: "Session revoked and cookie cleared"}}}
  /me:
    get: {operationId: identity_me, summary: 读取本人身份, x-phase: M2, responses: {<<: *errors, '200': {description: "Current user", content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}}}
  /me/preferences:
    get: {operationId: identity_get_preferences, summary: 读取本人偏好, x-phase: M2, responses: {<<: *errors, '200': {description: "Preferences", headers: {ETag: *etag}, content: {application/json: {schema: {$ref: '#/components/schemas/Preferences'}}}}}}
    put: {operationId: identity_put_preferences, summary: 更新本人偏好, x-phase: M2, parameters: *put_headers, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PreferencesWrite'}}}}, responses: {<<: *errors, '200': {description: "Updated preferences", headers: {ETag: *etag}, content: {application/json: {schema: {$ref: '#/components/schemas/Preferences'}}}}, '412': *problem, '428': *problem}}
  /me/profile:
    get: {operationId: identity_get_profile, summary: 读取本人档案, x-phase: M2, responses: {<<: *errors, '200': {description: "Profile", headers: {ETag: *etag}, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}}}
    put: {operationId: identity_put_profile, summary: 更新本人档案, x-phase: M2, parameters: *put_headers, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileWrite'}}}}, responses: {<<: *errors, '200': {description: "Updated profile", headers: {ETag: *etag}, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}, '412': *problem, '428': *problem}}
  /capabilities:
    get: {operationId: identity_capabilities, summary: 查询服务端已开启能力, x-phase: M2, responses: {<<: *errors, '200': {description: "Server feature gates; not local device capabilities", content: {application/json: {schema: {$ref: '#/components/schemas/Capabilities'}}}}}}
  /dashboard:
