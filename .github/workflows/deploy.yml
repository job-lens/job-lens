name: Deploy JobLens Release
on:
  workflow_run:
    workflows: [Architecture CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Full main commit SHA with successful Architecture CI
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: joblens-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'job-lens/job-lens' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: Production
      url: https://j.qunxue.xyz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact main commit and CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REVISION: ${{ inputs.revision }}
          CI_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          DEPLOY_REVISION=${DEPLOY_REVISION:-${CI_REVISION:-}}
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
          sha=$(git rev-parse --verify "$DEPLOY_REVISION^{commit}")
          [[ "$sha" == "$DEPLOY_REVISION" ]] || exit 1
          git merge-base --is-ancestor "$sha" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100" |
            jq -e --arg sha "$sha" '[.workflow_runs[] | select(.name == "Architecture CI" and .head_sha == $sha and .head_branch == "main" and .event == "push")] | sort_by(.run_started_at) | last | .status == "completed" and .conclusion == "success"'
          git checkout --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check independent deployment setup
        env:
          DEPLOY_HOST: ${{ secrets.JOBLENS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.JOBLENS_DEPLOY_USER }}
          SSHPASS: ${{ secrets.JOBLENS_DEPLOY_PASSWORD }}
          KNOWN_HOSTS: ${{ secrets.JOBLENS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing JOBLENS_DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing JOBLENS_DEPLOY_USER}"
          : "${SSHPASS:?Missing JOBLENS_DEPLOY_PASSWORD}"
          : "${KNOWN_HOSTS:?Missing JOBLENS_DEPLOY_KNOWN_HOSTS}"
      - name: Install transfer client
        run: sudo apt-get update -qq && sudo apt-get install -y sshpass rsync
      - name: Read actual production baseline and select services
        id: scope
        env: &ssh-env
          DEPLOY_HOST: ${{ secrets.JOBLENS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.JOBLENS_DEPLOY_USER }}
          SSHPASS: ${{ secrets.JOBLENS_DEPLOY_PASSWORD }}
          KNOWN_HOSTS: ${{ secrets.JOBLENS_DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/joblens-known-hosts"
          cat > "$RUNNER_TEMP/joblens-ssh.sh" <<'SH'
          options=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/joblens-known-hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=15 -o ServerAliveInterval=15)
          remote() { sshpass -e ssh "${options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "$@"; }
          SH
          source "$RUNNER_TEMP/joblens-ssh.sh"
          base=$(remote 'cat /opt/job-lens/deployed-sha')
          python tools/release_scope.py "$base" "$SHA" > scope.json
          for key in api web migrations; do echo "$key=$(jq -r .$key scope.json)" >> "$GITHUB_OUTPUT"; done
          cat scope.json >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@v3
        if: steps.scope.outputs.api == 'true' || steps.scope.outputs.web == 'true'
      - name: Build affected API with persistent cache
        if: steps.scope.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/api.Dockerfile
          platforms: linux/amd64
          load: true
          tags: joblens-api:${{ steps.release.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
          cache-from: type=gha,scope=joblens-api
          cache-to: type=gha,mode=max,scope=joblens-api
      - name: Stamp affected frontend
        if: steps.scope.outputs.web == 'true'
        env:
          SHA: ${{ steps.release.outputs.sha }}
        run: printf '{"sha":"%s"}\n' "$SHA" > apps/web/public/version.json
      - name: Build affected web with persistent cache
        if: steps.scope.outputs.web == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web.Dockerfile
          platforms: linux/amd64
          load: true
          tags: joblens-web:${{ steps.release.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
          cache-from: type=gha,scope=joblens-web
          cache-to: type=gha,mode=max,scope=joblens-web
      - name: Record exact identities and layer recipes
        if: steps.scope.outputs.api == 'true' || steps.scope.outputs.web == 'true'
        env:
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p bundle blobs
          cp scope.json bundle/release.json
          cp infra/compose.production.yaml infra/Caddyfile.production tools/deploy_joblens.sh tools/image_layers.py tools/release_headroom.py tools/verify_image_identity.py bundle/
          python tools/package_incremental.py "$SHA"
          (cd bundle && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.api == 'true' || steps.scope.outputs.web == 'true'
        with:
          name: joblens-${{ steps.release.outputs.sha }}
          path: bundle/
          retention-days: 7
      - name: Transfer missing content and update affected services
        if: steps.scope.outputs.api == 'true' || steps.scope.outputs.web == 'true'
        env: *ssh-env
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/joblens-ssh.sh"
          remote "test -f /opt/job-lens/runtime-override.yaml && mkdir -p /opt/job-lens/releases/$SHA /opt/job-lens/image-blobs"
          sshpass -e scp "${options[@]}" bundle/* "$DEPLOY_USER@$DEPLOY_HOST:/opt/job-lens/releases/$SHA/"
          bytes=$(remote "python3 /opt/job-lens/releases/$SHA/release_headroom.py /opt/job-lens/releases/$SHA /opt/job-lens/image-blobs")
          remote "bash -s -- $bytes" < tools/preflight_joblens.sh
          echo "Release metadata file bytes=$(find bundle -type f -printf '%s\n' | awk '{sum+=$1} END {print sum}')" | tee -a "$GITHUB_STEP_SUMMARY"
          # Content addressed names are immutable; rsync atomically installs each missing file.
          sshpass -e rsync -az --ignore-existing --stats -e "ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/joblens-known-hosts -o PreferredAuthentications=password -o PubkeyAuthentication=no" blobs/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/job-lens/image-blobs/" | tee transfer-stats.txt
          cat transfer-stats.txt >> "$GITHUB_STEP_SUMMARY"
          remote "bash /opt/job-lens/releases/$SHA/deploy_joblens.sh $SHA" | tee deployment-receipt.txt
          cat deployment-receipt.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Advance evaluated revision without rebuilding or restarting
        if: steps.scope.outputs.api != 'true' && steps.scope.outputs.web != 'true'
        env: *ssh-env
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/joblens-ssh.sh"
          remote "flock -n /opt/job-lens/deploy.lock bash -c 'printf %s $SHA > /opt/job-lens/deployed-sha.tmp; mv /opt/job-lens/deployed-sha.tmp /opt/job-lens/deployed-sha'"
          echo 'Business build=0; artifact upload bytes=0; restarted services=[]' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public health and service release versions
        env: *ssh-env
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 https://j.qunxue.xyz/api/v1/health/ready | jq -e '.status == "ok"'
          if [[ '${{ steps.scope.outputs.web }}' == true ]]; then
            curl --fail --silent --show-error --max-time 15 https://j.qunxue.xyz/version.json | jq -e --arg sha "$SHA" '.sha == $sha'
          fi
