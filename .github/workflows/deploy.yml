name: Deploy JobLens Release
on:
  push:
    branches: [diagnose/email-logs-readonly-42]
  workflow_run:
    workflows: [Architecture CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Full main commit SHA with successful Architecture CI
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: joblens-production
  cancel-in-progress: false
jobs:
  mail-diagnostics:
    # Branch-only diagnostic candidate. Do not merge just to run this job.
    # Uses the already registered workflow and its existing revision input.
    if: >-
      github.repository == 'job-lens/job-lens' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/diagnose/email-logs-readonly-42'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: Production
      url: https://j.qunxue.xyz
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate expected deployed revision
        env:
          EXPECTED_REVISION: ${{ inputs.revision || 'a599a1b20fd867a0de88ea1c4912a559991e147f' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - name: Install SSH client on ephemeral runner
        run: sudo apt-get update -qq && sudo apt-get install -y sshpass
      - name: Read existing privacy-safe mail diagnostics only
        env:
          DEPLOY_HOST: ${{ secrets.JOBLENS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.JOBLENS_DEPLOY_USER }}
          SSHPASS: ${{ secrets.JOBLENS_DEPLOY_PASSWORD }}
          KNOWN_HOSTS: ${{ secrets.JOBLENS_DEPLOY_KNOWN_HOSTS }}
          EXPECTED_REVISION: ${{ inputs.revision || 'a599a1b20fd867a0de88ea1c4912a559991e147f' }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing JOBLENS_DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing JOBLENS_DEPLOY_USER}"
          : "${SSHPASS:?Missing JOBLENS_DEPLOY_PASSWORD}"
          : "${KNOWN_HOSTS:?Missing JOBLENS_DEPLOY_KNOWN_HOSTS}"
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
          umask 077
          known_hosts="$RUNNER_TEMP/joblens-diagnostics-known-hosts"
          trap 'rm -f "$known_hosts"' EXIT
          printf '%s\n' "$KNOWN_HOSTS" > "$known_hosts"
          options=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o LogLevel=ERROR)
          # Script enters via stdin; no server file, environment, image, service,
          # database, mail request, credential or other project is changed.
          if ! sshpass -e ssh "${options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "python3 - $EXPECTED_REVISION" < tools/read_rate_diagnostics.py 2>/dev/null; then
            printf 'Read-only mail diagnostics failed; no deployment was requested.\n' >&2
            exit 1
          fi
  deploy:
    if: >-
      github.repository == 'job-lens/job-lens' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: Production
      url: https://j.qunxue.xyz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact main commit and CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REVISION: ${{ inputs.revision }}
          CI_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          DEPLOY_REVISION=${DEPLOY_REVISION:-${CI_REVISION:-}}
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
          sha=$(git rev-parse --verify "$DEPLOY_REVISION^{commit}")
          [[ "$sha" == "$DEPLOY_REVISION" ]] || exit 1
          git merge-base --is-ancestor "$sha" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100" |
            jq -e --arg sha "$sha" '[.workflow_runs[] | select(.name == "Architecture CI" and .head_sha == $sha and .head_branch == "main" and .event == "push")] | sort_by(.run_started_at) | last | .status == "completed" and .conclusion == "success"'
          git checkout --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check independent deployment setup
        env:
          DEPLOY_HOST: ${{ secrets.JOBLENS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.JOBLENS_DEPLOY_USER }}
          SSHPASS: ${{ secrets.JOBLENS_DEPLOY_PASSWORD }}
          KNOWN_HOSTS: ${{ secrets.JOBLENS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing JOBLENS_DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing JOBLENS_DEPLOY_USER}"
          : "${SSHPASS:?Missing JOBLENS_DEPLOY_PASSWORD}"
          : "${KNOWN_HOSTS:?Missing JOBLENS_DEPLOY_KNOWN_HOSTS}"
      - name: Build on runner and package exact images
        env:
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir bundle
          printf '{"sha":"%s"}\n' "$SHA" > apps/web/public/version.json
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$SHA" -t "joblens-api:$SHA" -f infra/api.Dockerfile .
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$SHA" -t "joblens-web:$SHA" -f infra/web.Dockerfile .
          docker pull postgres:17-bookworm
          docker tag postgres:17-bookworm "joblens-postgres:$SHA"
          for image in api web postgres; do
            name="joblens-$image:$SHA"
            docker image inspect "$name" --format '{{.RepoTags}} {{.Id}}' >/dev/null
            printf '%s %s\n' "$name" "$(docker image inspect "$name" --format '{{.Id}}')" >> bundle/image-ids.txt
            docker save "$name" | gzip -1 > "bundle/$image.tar.gz"
          done
          python tools/verify_image_identity.py record bundle/image-identities.json bundle "$SHA"
          cp tools/verify_image_identity.py bundle/
          cp infra/compose.production.yaml infra/Caddyfile.production tools/deploy_joblens.sh bundle/
          (cd bundle && sha256sum *.tar.gz image-ids.txt image-identities.json verify_image_identity.py compose.production.yaml Caddyfile.production deploy_joblens.sh > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: joblens-${{ steps.release.outputs.sha }}
          path: bundle/
          retention-days: 7
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y sshpass
      - name: Transfer and deploy only the JobLens project
        env:
          DEPLOY_HOST: ${{ secrets.JOBLENS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.JOBLENS_DEPLOY_USER }}
          SSHPASS: ${{ secrets.JOBLENS_DEPLOY_PASSWORD }}
          KNOWN_HOSTS: ${{ secrets.JOBLENS_DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/joblens-known-hosts"
          options=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/joblens-known-hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=15)
          bytes=$(du -sb bundle | cut -f1)
          sshpass -e ssh "${options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $bytes" < tools/preflight_joblens.sh
          # First install is separately provisioned; do not create identities or credentials here.
          sshpass -e ssh "${options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -f /etc/job-lens/joblens.env && test -f /opt/job-lens/runtime-override.yaml && test -d /opt/job-lens && mkdir -p /opt/job-lens/releases/$SHA"
          sshpass -e scp "${options[@]}" bundle/* "$DEPLOY_USER@$DEPLOY_HOST:/opt/job-lens/releases/$SHA/"
          sshpass -e ssh "${options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /opt/job-lens/releases/$SHA/deploy_joblens.sh $SHA"
      - name: Verify public health and release version
        env:
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 https://j.qunxue.xyz/api/v1/health/ready | jq -e '.status == "ok"'
          curl --fail --silent --show-error --max-time 15 https://j.qunxue.xyz/version.json | jq -e --arg sha "$SHA" '.sha == $sha'
          printf 'Verified HTTPS, readiness and public revision %s\n' "$SHA" >> "$GITHUB_STEP_SUMMARY"
