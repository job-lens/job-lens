name: Android Verified Test Release
on:
  pull_request:
    paths: ['.github/workflows/android-test-release.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/android-test-release.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-verified-test-release
  cancel-in-progress: false
env:
  APK: joblens-0.1.1-test-e01de0b6.apk
  APK_SHA256: b89b62155bb461408731032a7093afc03eeee164b987c262337722f22e577639
  APK_BYTES: '10754563'
  RELEASE_TAG: android-v0.1.1-test-e01de0b6
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retrieve immutable verified APK without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 'https://j.qunxue.xyz/downloads/joblens-android-test.apk' -o "$APK"
          printf '%s  %s\n' "$APK_SHA256" "$APK" > SHA256SUMS
          sha256sum --check SHA256SUMS
          test "$(stat -c %s "$APK")" = "$APK_BYTES"
          mkdir release
          mv "$APK" SHA256SUMS release/
          cat > release/RELEASE-NOTES.txt <<'EOF'
          JobLens 0.1.1 / versionCode 2 Android 测试版。原包 CI 37209441193，真实 Android instrumentation 14/14 通过。本次仅镜像已验证的原包，不重编译。
          来源提交：e01de0b6686b1c045a09bac8f44f96de4b293a5d
          这是临时 CI debug 签名测试包，不是正式商店版本。签名可能与旧测试安装不同，无法保证覆盖升级；如系统拒绝安装，先确认并备份本地数据，再决定卸载重装（卸载可能删除本地数据）。
          SHA-256: b89b62155bb461408731032a7093afc03eeee164b987c262337722f22e577639
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: verified-test-release
          path: release/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: verify
    if: github.repository == 'job-lens/job-lens' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-test-release
          path: release
      - name: Publish test prerelease and verify downloaded release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" "$APK" SHA256SUMS RELEASE-NOTES.txt --repo 'job-lens/job-lens' --target 'e01de0b6686b1c045a09bac8f44f96de4b293a5d' --title 'JobLens Android 测试版 android-v0.1.1-test-e01de0b6' --notes-file RELEASE-NOTES.txt --prerelease --latest=false
          mkdir downloaded
          gh release download "$RELEASE_TAG" --repo 'job-lens/job-lens' --pattern "$APK" --pattern SHA256SUMS --dir downloaded
          (cd downloaded && sha256sum --check SHA256SUMS)
          printf 'Verified release: https://github.com/job-lens/job-lens/releases/tag/%s\nSHA-256: %s\n' "$RELEASE_TAG" "$APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
