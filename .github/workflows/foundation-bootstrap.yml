name: Foundation dependency bootstrap
on:
  push:
    branches: [feat/architecture-foundation]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          python-version: "3.13"
      - run: uv lock
      - run: pnpm install --lockfile-only && pnpm install --frozen-lockfile
      - run: uv run python tools/bootstrap_contract.py
      - run: pnpm generate:api
      - name: Persist generated contract and dependency locks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock pnpm-lock.yaml contracts/openapi.yaml apps/web/src/shared/api/schema.d.ts
          git diff --cached --quiet || git commit -m 'chore(deps): lock toolchains and generate the shared API types'
          git push origin HEAD:feat/architecture-foundation
      - name: Prepare offline verification tools
        run: |
          uv run --with pip python -m pip download --only-binary=:all: -d tool-wheels ruff mypy 'psycopg[binary]' openapi-spec-validator types-PyYAML
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-generated
          path: |
            uv.lock
            pnpm-lock.yaml
            contracts/openapi.yaml
            apps/web/src/shared/api/schema.d.ts
            tool-wheels/
          retention-days: 1
